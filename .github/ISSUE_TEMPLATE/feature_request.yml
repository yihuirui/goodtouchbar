name: Feature request
description: Suggest a user-facing improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: >-
        Do not include credentials, private session data, tokens, or unredacted logs.
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the task or limitation you encounter.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how you expect the feature to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional context about other approaches.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked that this report contains no credentials, private session contents, or unredacted local paths/logs.
          required: true
