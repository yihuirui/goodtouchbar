name: Bug report
description: Report a reproducible problem with goodtouchbar.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Do not include credentials, private session data, tokens, or unredacted logs.
        For a security vulnerability, use the private process in SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: goodtouchbar version and build
      placeholder: "0.3.0 (build 3)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 13.x"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Mac model, architecture, and Touch Bar mode
      description: Include the model identifier if known (for example, Mac14,7), chip/architecture, and Auto, On, or Off mode.
      placeholder: "Mac14,7, arm64, Auto"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Feature area
      options:
        - Touch Bar presentation
        - System controls
        - AI activity or quota
        - WorkBuddy monitor
        - System metrics or sensors
        - Fan control
        - Presets
        - Build or installation
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest sequence that reproduces the issue.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked that this report contains no credentials, private session contents, or unredacted local paths/logs.
          required: true
