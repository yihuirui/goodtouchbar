name: macOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    name: Test and package ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Confirm native runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: test "$(/usr/bin/uname -m)" = "$EXPECTED_ARCH"

      - name: Set up Node.js for JavaScript checks
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run public checks
        env:
          TEST_ARCH: ${{ matrix.arch }}
        run: /bin/zsh scripts/test-public.sh

      - name: Build native app package without opening it
        run: |
          /bin/zsh build-app.sh --arch "${{ matrix.arch }}" --no-open
          test -d "dist/0.3.0/${{ matrix.arch }}/goodtouchbar.app"
          test -f "dist/goodtouchbar-0.3.0-${{ matrix.arch }}.zip"
          test -f "dist/goodtouchbar-0.3.0-${{ matrix.arch }}.zip.sha256"
          test -f "dist/goodtouchbar-0.3.0-${{ matrix.arch }}-build-manifest.txt"

      - name: Save manual build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: goodtouchbar-0.3.0-${{ matrix.arch }}
          path: |
            dist/0.3.0/${{ matrix.arch }}/
            dist/goodtouchbar-0.3.0-${{ matrix.arch }}.zip
            dist/goodtouchbar-0.3.0-${{ matrix.arch }}.zip.sha256
            dist/goodtouchbar-0.3.0-${{ matrix.arch }}-build-manifest.txt
          if-no-files-found: error
          retention-days: 7
